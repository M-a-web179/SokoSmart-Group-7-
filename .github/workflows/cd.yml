name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 888281659507.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPOSITORY: sokosmart-price

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/price-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/price-service/requirements-dev.txt
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/price-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/price-service/requirements-dev.txt
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r services/price-service/requirements.txt -r services/price-service/requirements-dev.txt

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sokosmart-price-service:scan .
      - name: Scan image for HIGH and CRITICAL vulnerabilities
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v ${{ github.workspace }}/.trivycache:/root/.cache
          aquasec/trivy:0.57.1 image
          --db-repository ghcr.io/aquasecurity/trivy-db:2
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          sokosmart-price-service:scan

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: python -m pip install checkov
      - name: Scan Terraform
        run: >
          checkov -d terraform --framework terraform --compact
          --skip-check CKV_AWS_88,CKV_AWS_126,CKV2_AWS_41,CKV2_AWS_5,CKV2_AWS_11,CKV_AWS_394,CKV_AWS_18,CKV2_AWS_62,CKV_AWS_144,CKV_AWS_145,CKV_AWS_353,CKV_AWS_118,CKV_AWS_293,CKV_AWS_157,CKV2_AWS_30,CKV_AWS_149,CKV_AWS_136,CKV2_AWS_57

  deploy:
    needs: [lint, test, pip-audit, trivy, checkov]
    runs-on: ubuntu-latest
    env:
      BASTION_IP: ${{ vars.BASTION_IP }}
      APP_PRIVATE_IP: ${{ vars.APP_PRIVATE_IP }}
      BASTION_SG_NAME: ${{ vars.BASTION_SG_NAME }}
      DB_SECRET_ARN: ${{ vars.DB_SECRET_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag from the commit SHA
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "APP_IMAGE=${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}" >> "$GITHUB_ENV"

      - name: Verify AWS authentication
        run: aws sts get-caller-identity --query Arn --output text

      - name: Log in to ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push the image if this tag is not in ECR yet
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Tag ${IMAGE_TAG} already exists in ECR, skipping push."
          else
            docker build --provenance=false --sbom=false -t "$APP_IMAGE" .
            docker push "$APP_IMAGE"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible and collections
        run: |
          python -m pip install "ansible-core>=2.18,<2.19"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write the SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/sokosmart_deploy"

      - name: Open SSH on the bastion security group for this runner
        run: |
          RUNNER_IP="$(curl -s https://checkip.amazonaws.com | tr -d '[:space:]')"
          SG_ID="$(aws ec2 describe-security-groups --filters "Name=group-name,Values=${BASTION_SG_NAME}" --query 'SecurityGroups[0].GroupId' --output text)"
          echo "SG_ID=${SG_ID}" >> "$GITHUB_ENV"
          echo "RUNNER_CIDR=${RUNNER_IP}/32" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" --protocol tcp --port 22 --cidr "${RUNNER_IP}/32"

      - name: Generate the Ansible inventory
        run: |
          jq -n --arg b "$BASTION_IP" --arg a "$APP_PRIVATE_IP" \
            '{bastion_public_ip:{value:$b},app_private_ip:{value:$a},ssh_user:{value:"ubuntu"}}' > "$RUNNER_TEMP/outputs.json"
          python ansible/inventory_from_terraform.py --key "$HOME/.ssh/sokosmart_deploy" --outputs "$RUNNER_TEMP/outputs.json"

      - name: Deploy the application with Ansible
        working-directory: ansible
        run: ansible-playbook site.yml -e "app_image=${APP_IMAGE}" -e "db_secret_arn=${DB_SECRET_ARN}"

      - name: Configure the bastion proxy with Ansible
        working-directory: ansible
        run: ansible-playbook proxy.yml

      - name: Verify /health through the bastion public IP
        run: |
          code=000
          for i in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://${BASTION_IP}/health" || true)"
            [ "$code" = "200" ] && break
            sleep 5
          done
          curl -s "http://${BASTION_IP}/health"
          echo
          test "$code" = "200"

      - name: Revoke the temporary SSH rule
        if: always() && env.SG_ID != '' && env.RUNNER_CIDR != ''
        run: aws ec2 revoke-security-group-ingress --group-id "$SG_ID" --protocol tcp --port 22 --cidr "$RUNNER_CIDR"