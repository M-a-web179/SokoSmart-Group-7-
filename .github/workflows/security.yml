name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r services/price-service/requirements.txt -r services/price-service/requirements-dev.txt

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sokosmart-price-service:scan .
      - name: Scan image for HIGH and CRITICAL vulnerabilities
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v ${{ github.workspace }}/.trivycache:/root/.cache
          aquasec/trivy:0.57.1 image
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          sokosmart-price-service:scan

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: python -m pip install checkov
      - name: Scan Terraform
        run: checkov -d terraform --framework terraform --compact