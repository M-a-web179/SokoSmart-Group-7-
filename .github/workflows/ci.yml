name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/price-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/price-service/requirements-dev.txt
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/price-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/price-service/requirements-dev.txt
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max