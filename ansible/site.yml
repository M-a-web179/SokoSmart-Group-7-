---
- name: Gather the bastion address used for the app firewall rule
  hosts: bastion
  gather_facts: true
  tasks:
    - name: Confirm the bastion private address is known
      ansible.builtin.assert:
        that:
          - ansible_facts.default_ipv4.address is defined

- name: Configure and deploy the team application
  hosts: app
  become: true
  gather_facts: true
  vars:
    ssh_allowed_cidr: "{{ hostvars[groups['bastion'][0]].ansible_facts.default_ipv4.address }}/32"
  pre_tasks:
    - name: Verify supported host and safe deployment settings
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.service_mgr == 'systemd'
          - ansible_user != 'root'
          - app_image | length > 0
          - app_port | int > 0
          - app_port | int < 65536
          - ssh_port | int != app_port | int
          - ssh_allowed_cidr | default('') | length > 0
          - ssh_allowed_cidr not in ['0.0.0.0/0', '::/0']
        fail_msg: Use an Ubuntu systemd host, a sudo user with SSH key access, and valid image/port settings.
  roles:
    - role: docker
    - role: ssh_hardening
    - role: firewall
    - role: app

- name: Configure the public reverse proxy after app deployment
  ansible.builtin.import_playbook: proxy.yml
