---
app_name: sokosmart-price
app_dir: /opt/sokosmart
app_image: ""
app_image_archive: ""
app_port: 5000
app_container_port: 5000
app_bind_address: "0.0.0.0"
app_health_path: /health
app_readiness_path: /ready
app_env:
  FLASK_DEBUG: "0"
  SEED_FILE: data/seed_prices.json
aws_region: eu-west-1
# The image URL comes from Terraform's ecr_repository_url output.
ecr_registry: "{{ app_image.split('/')[0] }}"
db_secret_arn: ""
ssh_port: 22
docker_nested: "{{ ansible_facts.virtualization_type in ['docker', 'container', 'containerd'] }}"
