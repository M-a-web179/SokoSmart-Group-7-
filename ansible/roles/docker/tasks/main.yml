---
- name: Install Docker and deployment dependencies
  ansible.builtin.apt:
    name:
      - docker.io
      - python3-docker
      - python3-requests
      - ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Configure storage for Docker inside the lab server
  ansible.builtin.copy:
    content: |
      {"storage-driver": "vfs"}
    dest: /etc/docker/daemon.json
    mode: "0644"
  when: docker_nested | bool
  notify: Restart Docker

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Apply Docker configuration before deployment
  ansible.builtin.meta: flush_handlers
