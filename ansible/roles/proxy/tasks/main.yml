---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove the default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Install the reverse proxy configuration
  ansible.builtin.template:
    src: sokosmart.conf.j2
    dest: /etc/nginx/conf.d/sokosmart.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Check the nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started

- name: Apply the proxy configuration
  ansible.builtin.meta: flush_handlers
